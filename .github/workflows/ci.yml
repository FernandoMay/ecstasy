name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Parity with Netlify (netlify.toml: NODE_VERSION=24) and deployment docs.
env:
  NODE_VERSION: "24"
  STELLAR_CLI_VERSION: "30.0.1"

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/ecstasy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32v1-none
          components: rustfmt, clippy
      - name: Check
        run: cargo check
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test state machine (24 tests)
        run: cargo test
      - name: Install Stellar CLI
        run: cargo install stellar-cli --version ${{ env.STELLAR_CLI_VERSION }} --locked
      - name: Build wasm
        run: stellar contract build

  boveda:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/boveda
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32v1-none
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test vault
        run: cargo test
      - name: Install Stellar CLI
        run: cargo install stellar-cli --version ${{ env.STELLAR_CLI_VERSION }} --locked
      - name: Build wasm
        run: stellar contract build

  disputes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/disputes
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32v1-none
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test disputes
        run: cargo test
      - name: Install Stellar CLI
        run: cargo install stellar-cli --version ${{ env.STELLAR_CLI_VERSION }} --locked
      - name: Build wasm
        run: stellar contract build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: All unit tests (shared + web)
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Stellar CLI for bindings check
        run: cargo install stellar-cli --version ${{ env.STELLAR_CLI_VERSION }} --locked
      - name: Build wasm for release checks
        run: cd contracts/ecstasy && stellar contract build
      - name: Verify wasm fingerprint against release docs
        run: npm run verify:wasm
      - name: Detect dependency/version drift
        run: npm run verify:versions
      - name: Generated bindings in sync with wasm
        run: |
          cd contracts/ecstasy && stellar contract build
          cd ../../ && npm run generate:bindings --workspace=@ecstasy/stellar
          git diff --exit-code -- packages/stellar/src/generated/ecstasy.ts
      - name: No uncommitted changes after generation
        run: |
          STATUS="$(git status --porcelain)"
          if [[ -n "$STATUS" ]]; then
            echo "$STATUS"
            exit 1
          fi

  docs-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required docs
        run: |
          test -f README.md
          test -f docs/TECHNICAL_SPEC.md
          test -f docs/SECURITY.md
          test -f docs/BRANDING.md
          test -f docs/DEMO_SCRIPT.md
          test -f docs/EVIDENCE.md
          test -f docs/FUNCTIONS_FOR_REVIEW.md
          test -f docs/RUNBOOK.md
          test -f docs/RELEASES/testnet-rc-1.md

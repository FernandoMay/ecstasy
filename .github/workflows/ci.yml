name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/ecstasy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Check
        run: cargo check
      - name: Test state machine
        run: cargo test
      - name: Install Stellar CLI
        run: cargo install stellar-cli --version 30.0.1 --locked
      - name: Build wasm
        run: stellar contract build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Shared package tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  docs-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required docs
        run: |
          test -f README.md
          test -f docs/TECHNICAL_SPEC.md
          test -f docs/SECURITY.md
          test -f docs/BRANDING.md
          test -f docs/DEMO_SCRIPT.md
          test -f docs/EVIDENCE.md

# Netlify build configuration for the ECSTASY npm-workspaces monorepo.
#
# Netlify UI must use:
#   Production branch: main
#   Package directory: apps/web   (site files / config discovery)
#   Base directory:    unset      (root, so npm workspaces resolve)
# All values below are relative to the repository root (the base directory).

[build]
  command = "npm run build"
  publish = "apps/web/.next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# The Next.js Runtime (OpenNext adapter) is declared explicitly because this
# is an npm-workspaces monorepo: Netlify auto-detection does not see `next` in
# the root package.json. It provisions the serverless function that serves App
# Router route handlers such as POST /api/challenge-payment. No other plugins.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[package]
name = "flow-v2"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "29.0.0"

[dev-dependencies]
soroban-sdk = { version = "29.0.0", features = ["testutils"] }
role-registry-v2 = { path = "../role-registry-v2" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
